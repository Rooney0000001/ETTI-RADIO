<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETTI RADIO & TV — Team Admin</title>
<style>
  :root{
    --navy:#0b1530;
    --navy-deep:#070d1f;
    --gold:#f2b705;
    --crimson:#c21807;
    --cream:#f3ecd9;
    --line: rgba(242,183,5,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:var(--cream);
    font-family:'Segoe UI', sans-serif;
    min-height:100vh;
    padding:20px;
  }
  .card{
    background:rgba(255,255,255,0.03);
    border:1px solid var(--line);
    border-radius:14px;
    padding:24px 20px;
    max-width:520px;
    margin:0 auto 20px;
  }
  h1{ font-size:20px; color:var(--gold); margin-bottom:16px; }
  h2{ font-size:15px; color:var(--gold); margin-bottom:12px; }
  label{
    display:block;
    font-size:12px;
    letter-spacing:1px;
    color:rgba(243,236,217,0.7);
    margin-bottom:6px;
    margin-top:14px;
  }
  input[type="text"], input[type="password"], textarea{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:rgba(0,0,0,0.3);
    color:var(--cream);
    font-size:14px;
    font-family:inherit;
  }
  textarea{ min-height:70px; resize:vertical; }
  input:focus, textarea:focus{ outline:2px solid var(--gold); }
  button{
    padding:13px 20px;
    border-radius:8px;
    border:none;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    margin-top:18px;
  }
  #postBtn{ background:var(--crimson); color:white; width:100%; }
  #status{
    margin-top:14px;
    font-size:13px;
    padding:10px;
    border-radius:8px;
    display:none;
  }
  #status.success{ background:rgba(46,204,113,0.15); color:#6be29a; display:block; }
  #status.error{ background:rgba(194,24,7,0.15); color:#ff8a75; display:block; }

  .member-item{
    display:flex;
    gap:12px;
    border:1px solid rgba(242,183,5,0.15);
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
    align-items:flex-start;
  }
  .member-item img{
    width:48px; height:48px;
    border-radius:50%;
    object-fit:cover;
    flex-shrink:0;
    border:1px solid var(--line);
  }
  .member-item .no-photo{
    width:48px; height:48px;
    border-radius:50%;
    background:rgba(242,183,5,0.1);
    flex-shrink:0;
  }
  .member-item .info{ flex:1; }
  .member-item h3{ font-size:14px; color:var(--cream); margin-bottom:2px; }
  .member-item .meta{ font-size:11px; color:rgba(243,236,217,0.5); margin-bottom:6px; }
  .member-item p{ font-size:13px; color:rgba(243,236,217,0.7); margin-bottom:8px; }
  .member-item button{
    margin-top:0;
    padding:7px 12px;
    font-size:12px;
    background:transparent;
    border:1px solid var(--crimson);
    color:#ff8a75;
  }
</style>
</head>
<body>

<div class="card">
  <h1>ETTI RADIO & TV — Team Admin</h1>

  <label>Producer Password</label>
  <input type="password" id="password" placeholder="Enter password">

  <label>Full Name</label>
  <input type="text" id="name" placeholder="e.g. Sarah Owiso">

  <label>Role</label>
  <input type="text" id="role" placeholder="e.g. Station Manager, Sports Reporter, Producer">

  <label>Short Bio (optional)</label>
  <textarea id="bio" placeholder="A sentence or two about them"></textarea>

  <label>Links to a show? (optional)</label>
  <input type="text" id="showLink" placeholder="e.g. Kingdom Drive Show">

  <label>Photo (optional)</label>
  <input type="file" id="imageFile" accept="image/*" style="padding:10px; background:rgba(0,0,0,0.3); border:1px solid rgba(242,183,5,0.3); border-radius:8px; width:100%; color:var(--cream);">
  <div id="imagePreviewWrap" style="display:none; margin-top:10px;">
    <img id="imagePreview" style="max-width:120px; border-radius:50%; border:1px solid var(--line);">
    <button type="button" onclick="clearImage()" style="margin-top:8px; display:block; background:transparent; border:1px solid var(--crimson); color:#ff8a75; padding:6px 12px; font-size:12px;">Remove photo</button>
  </div>

  <button id="postBtn" onclick="createMember()">Add to Team</button>
  <div id="status"></div>
</div>

<div class="card">
  <h2>Current Team</h2>
  <div id="teamList">Loading...</div>
</div>

<script>
  const API_BASE = "https://etti-radio-backend.rooneywonder90.workers.dev";

  let currentImageBase64 = '';
  const MAX_DIMENSION = 400; // profile photos never need to be bigger than this
  const JPEG_QUALITY = 0.75;

  document.getElementById('imageFile').addEventListener('change', function(e){
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = function(evt){
      const img = new Image();
      img.onload = function(){
        // Resize down to MAX_DIMENSION, keeping aspect ratio, then compress as JPEG.
        // This keeps team photos small and fast to load, since profile pictures
        // never need to be full camera resolution.
        let w = img.width, h = img.height;
        if(w > h && w > MAX_DIMENSION){
          h = Math.round(h * (MAX_DIMENSION / w));
          w = MAX_DIMENSION;
        } else if(h > MAX_DIMENSION){
          w = Math.round(w * (MAX_DIMENSION / h));
          h = MAX_DIMENSION;
        }

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);

        currentImageBase64 = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
        document.getElementById('imagePreview').src = currentImageBase64;
        document.getElementById('imagePreviewWrap').style.display = 'block';
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  });

  function clearImage(){
    currentImageBase64 = '';
    document.getElementById('imageFile').value = '';
    document.getElementById('imagePreviewWrap').style.display = 'none';
  }

  async function loadTeam(){
    const listEl = document.getElementById('teamList');
    try{
      const res = await fetch(API_BASE + '/api/team');
      const data = await res.json();
      if(!data.team || data.team.length === 0){
        listEl.innerHTML = '<p style="color:rgba(243,236,217,0.5); font-size:13px;">No team members added yet.</p>';
        return;
      }
      listEl.innerHTML = data.team.map(m => `
        <div class="member-item">
          ${m.photo_url ? '<img src="' + m.photo_url + '">' : '<div class="no-photo"></div>'}
          <div class="info">
            <h3>${escapeHtml(m.name)}</h3>
            <div class="meta">${escapeHtml(m.role)}${m.show_link ? ' · ' + escapeHtml(m.show_link) : ''}</div>
            ${m.bio ? '<p>' + escapeHtml(m.bio) + '</p>' : ''}
            <button onclick="deleteMember(${m.id})">Delete</button>
          </div>
        </div>
      `).join('');
    } catch(e){
      listEl.innerHTML = '<p style="color:#ff8a75;">Could not load the team.</p>';
    }
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function createMember(){
    const password = document.getElementById('password').value;
    const name = document.getElementById('name').value;
    const role = document.getElementById('role').value;
    const bio = document.getElementById('bio').value;
    const showLink = document.getElementById('showLink').value;
    const photoUrl = currentImageBase64;
    const statusEl = document.getElementById('status');

    statusEl.className = '';
    statusEl.style.display = 'none';

    if(!name || !role){
      statusEl.className = 'error';
      statusEl.textContent = 'Name and role are required.';
      return;
    }

    try{
      const res = await fetch(API_BASE + '/api/team', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ password, name, role, bio, photoUrl, showLink })
      });
      const data = await res.json();

      if(res.ok){
        statusEl.className = 'success';
        statusEl.textContent = 'Added to the team!';
        document.getElementById('name').value = '';
        document.getElementById('role').value = '';
        document.getElementById('bio').value = '';
        document.getElementById('showLink').value = '';
        clearImage();
        loadTeam();
      } else {
        statusEl.className = 'error';
        statusEl.textContent = data.error || 'Something went wrong';
      }
    } catch(e){
      statusEl.className = 'error';
      statusEl.textContent = 'Could not reach the server';
    }
  }

  async function deleteMember(id){
    const password = document.getElementById('password').value;
    if(!password){
      alert('Enter the producer password above first, then tap Delete again.');
      return;
    }
    if(!confirm('Remove this person from the team?')) return;

    try{
      const res = await fetch(API_BASE + '/api/team/' + id, {
        method: 'DELETE',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ password })
      });
      const data = await res.json();
      if(res.ok){
        loadTeam();
      } else {
        alert(data.error || 'Could not delete');
      }
    } catch(e){
      alert('Could not reach the server');
    }
  }

  loadTeam();
</script>

</body>
</html>
